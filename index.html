<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CherryPancake - Twitch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0e10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .stream-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .stream-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .reaction-overlay {
      position: fixed;
      bottom: 0;
      right: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      transform-origin: bottom right;
      animation: react-bob 4s ease-in-out infinite;
    }

    .reaction-avatar {
      width: clamp(160px, 22vw, 320px);
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.65)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes react-bob {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      25% {
        transform: translateY(-6px) rotate(-1deg);
      }
      75% {
        transform: translateY(-2px) rotate(1deg);
      }
    }

    @media (max-width: 600px) {
      .reaction-overlay {
        right: 8px;
      }
      .reaction-avatar {
        width: clamp(120px, 35vw, 180px);
      }
    }
  </style>
</head>

<body>

  <div class="stream-container">
    <iframe
      id="twitch-stream"
      src=""
      frameborder="0"
      allow="autoplay; fullscreen"
      allowfullscreen="true"
      scrolling="no">
    </iframe>
  </div>

  <div class="reaction-overlay" aria-hidden="true">
    <img src="ellie.webp" alt="Ellie reacting to the stream" class="reaction-avatar">
  </div>

  <script>
    (function () {
      const hostname = window.location.hostname || 'localhost';
      const iframe = document.getElementById('twitch-stream');
      
      const parents = new Set(['localhost', '127.0.0.1']);
      if (hostname) {
        parents.add(hostname);
      }

      const parentParams = Array.from(parents)
        .map(p => `parent=${encodeURIComponent(p)}`)
        .join('&');

      iframe.src = `https://player.twitch.tv/?channel=berrycrepe&${parentParams}&autoplay=true&muted=false`;
    })();
  </script>

</body>

</html>
